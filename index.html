<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1mcmNykIZfAFFUVDRValDahM2Ob_r9o5e">
  <title>Timesheets</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 50px; }
    .btn {
      background-color: #0366d6; color: white; padding: 12px 24px;
      text-decoration: none; border-radius: 6px; font-size: 16px; display: inline-block; cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Welcome to Timesheets</h2>
  <button class="btn" onclick="testConnection()">Test Backend Connection</button>

  <!-- Your JavaScript goes here, right inside the HTML file -->
  <script>
    // Replace this with your actual Google Apps Script Web App URL (ending in /exec)
    const SCRIPT_URL = "AKfycbwy116UERWojo03xyhm6TTCBtCvbYuvJXOPsLNMlDrpT2RdSfh-wOyCrKdUAJWBesRN/";

    async function testConnection() {
      try {
        let response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ 
            action: "login", 
            payload: { username: "admin", password: "admin123" } 
          })
        });
        let result = await response.json();
        alert("Server response: " + JSON.stringify(result));
      } catch (error) {
        alert("Error connecting to script: " + error);
      }
    }
  </script>

</body>
</html>
